stages:
  - build
  - deploy
  - publish


# ---------------------------------------------------------------------------
# Build & push to GitLab Container Registry
# Runs on every push. Tags the image with the commit SHA (and the Git tag when
# a tag is pushed). Also updates the :latest tag on every run.
# ---------------------------------------------------------------------------

build:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--insecure-registry=registry.ppouz.lan:443"]
  variables:
    DOCKER_TLS_CERTDIR: ""          # ← désactive TLS dind
    DOCKER_HOST: tcp://docker:2375  # ← port non-TLS
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "registry.ppouz.lan:443"
  script:
    - |
      TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      docker build \
        -t "$CI_REGISTRY_IMAGE:$TAG" \
        -t "$CI_REGISTRY_IMAGE:latest" \
        .
      docker push "$CI_REGISTRY_IMAGE:$TAG"
      docker push "$CI_REGISTRY_IMAGE:latest"

# ---------------------------------------------------------------------------
# Deploy via l'API Komodo (stack livebox_dashboard sur services) — sur tags Git
# Le compose de production vit dans Arthur/stacks (services/livebox_dashboard).
# ---------------------------------------------------------------------------
deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  image: alpine:3.20
  timeout: 15m
  # Variables de groupe (applications) : KOMODO_URL, KOMODO_API_KEY, KOMODO_API_SECRET (utilisateur de
  # service Komodo gitlab-ci, droit Write sur la stack seulement), PPOUZ_CA (fichier). La stack vit
  # dans Arthur/stacks (services/livebox_dashboard) ; seuls TAG et CI_REGISTRY_IMAGE de son Environment changent.
  variables:
    KOMODO_STACK: livebox_dashboard
    DEPLOY_TAG: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -eu
      k() { curl -fsS --cacert "$PPOUZ_CA" -X POST "$KOMODO_URL/$1" -H "X-Api-Key: $KOMODO_API_KEY" -H "X-Api-Secret: $KOMODO_API_SECRET" -H 'Content-Type: application/json' -d "$2"; }
      ENV=$(k read/GetStack "{\"stack\":\"$KOMODO_STACK\"}" | jq -r .config.environment | grep -vE '^(TAG|CI_REGISTRY_IMAGE)=' || true)
      ENV=$(printf '%s\nCI_REGISTRY_IMAGE=%s\nTAG=%s\n' "$ENV" "$CI_REGISTRY_IMAGE" "$DEPLOY_TAG")
      k write/UpdateStack "$(jq -nc --arg s "$KOMODO_STACK" --arg e "$ENV" '{id:$s,config:{environment:$e,auto_pull:true}}')" > /dev/null
      ID=$(k execute/DeployStack "{\"stack\":\"$KOMODO_STACK\"}" | jq -r '._id."$oid"')
      echo "Deploy Komodo de $KOMODO_STACK ($DEPLOY_TAG), update $ID"
      until UPD=$(k read/GetUpdate "{\"id\":\"$ID\"}") && [ "$(echo "$UPD" | jq -r .status)" = Complete ]; do sleep 5; done
      echo "$UPD" | jq -r '.logs[] | "== \(.stage) : \(if .success then "ok" else "ÉCHEC" end)"'
      echo "$UPD" | jq -e .success > /dev/null

publish-dockerhub:
  stage: publish
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--insecure-registry=registry.ppouz.lan:443"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "registry.ppouz.lan:443"
    - docker login -u "$DOCKERHUB_USER" -p "$DOCKERHUB_TOKEN" "docker.io"
  script:
    - |
      docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" "$DOCKERHUB_USER/$DOCKERHUB_IMAGE:$CI_COMMIT_TAG"
      docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" "$DOCKERHUB_USER/$DOCKERHUB_IMAGE:latest"
      docker push "$DOCKERHUB_USER/$DOCKERHUB_IMAGE:$CI_COMMIT_TAG"
      docker push "$DOCKERHUB_USER/$DOCKERHUB_IMAGE:latest"